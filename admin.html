<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self' blob: data: https://firebasestorage.googleapis.com; connect-src 'self' https://*.googleapis.com https://firestore.googleapis.com https://*.firebaseio.com https://firebasestorage.googleapis.com;">

<title>音声収集 - 管理者ページ</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <h1 class="page-title">管理者ページ</h1>
  <p class="page-note">送信された音声の確認・再生・ダウンロードができます</p>

  <!-- ログイン -->
  <div id="login-section" class="card">
    <input type="email" id="admin-email" placeholder="メールアドレス">
    <input type="password" id="admin-password" placeholder="パスワード">
    <button id="login-btn" class="btn-primary" style="width:100%; margin-top:10px;">ログイン</button>
    <div id="login-msg" class="status-msg"></div>
  </div>

  <!-- ダッシュボード -->
  <div id="dashboard-section" style="display:none;">
    <div class="admin-toolbar">
      <div id="summary-text" class="summary-text"></div>
      <div class="admin-toolbar-buttons">
        <button id="refresh-btn" class="btn-secondary-sm">🔄 更新</button>
        <button id="logout-btn" class="btn-secondary-sm">ログアウト</button>
      </div>
    </div>

    <div id="recordings-list"></div>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
